<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preferences</title>
  </head>
  <body class="prefs">
    <main class="prefs-body">
      <section class="prefs-section">
        <label class="prefs-label" for="prefs-dir">Custom scripts folder location</label>
        <div class="prefs-row">
          <input id="prefs-dir" class="prefs-input" type="text" readonly
                 placeholder="No folder selected" />
          <button id="prefs-change" class="prefs-button">Change…</button>
        </div>
        <div class="prefs-actions">
          <button id="prefs-clear" class="prefs-link">Clear</button>
          <span class="prefs-hint">Drop <code>.js</code> boop scripts in this folder. Files without a
            metadata header are treated as libraries you can <code>require()</code>.</span>
        </div>
      </section>

      <section class="prefs-section">
        <label class="prefs-label">Highlight colours</label>
        <div id="prefs-colors" class="prefs-colors"></div>
        <div class="prefs-actions">
          <button id="prefs-color-add" class="prefs-link">Add colour</button>
          <span class="prefs-hint">Presets for the right-click <strong>Highlight</strong> action; it
            picks a random unused one. Up to 6.</span>
        </div>
      </section>

      <section class="prefs-section">
        <label class="prefs-label" for="prefs-shortcut">Global shortcut — open a new boop</label>
        <div class="prefs-row">
          <input id="prefs-shortcut" class="prefs-input" type="text" readonly
                 placeholder="Not set" />
          <button id="prefs-shortcut-record" class="prefs-button">Record…</button>
        </div>
        <div class="prefs-actions">
          <button id="prefs-shortcut-reset" class="prefs-link">Reset to default</button>
          <span id="prefs-shortcut-hint" class="prefs-hint">Press this from any app to summon NeoBoop
            with a fresh boop. Needs at least one modifier (⌃⌥⇧⌘).</span>
        </div>
      </section>
    </main>
    <script type="module" src="/src/preferences.ts"></script>
  </body>
</html>
